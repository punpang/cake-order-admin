<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f2" />
    <link rel="preconnect" href="https://itleduijrckxdbhhuooi.supabase.co" crossorigin />
    <title>ร้านของคุณ</title>
    <style>
      /* หน้ากำลังโหลดก่อนแอปพร้อม · อนิเมชั่นชุดเดียวกันทั้งเว็บและแอป Android (CSS ล้วน ขึ้นได้ทันทีโดยไม่รอ JS)
         วงหมุนบอกว่ากำลังทำงาน · คลื่นแผ่จากไอคอน · ไอคอนหายใจเบา ๆ · ประกายดาวกระพริบ · จุดกำลังโหลดที่ข้อความ */
      .boot { box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 1.5rem; text-align: center; font: 16px system-ui, sans-serif; color: #57534e; background: radial-gradient(circle at 18% 12%, #ffe3ea 0, transparent 42%), radial-gradient(circle at 85% 88%, #ffe9d6 0, transparent 45%), #fff8f2; }
      .boot-art { position: relative; width: min(184px, 48vmin); aspect-ratio: 1; }
      .boot-ripple { position: absolute; inset: 12%; border-radius: 50%; background: rgb(214 51 108 / 0.2); opacity: 0; animation: boot-ripple 2.4s ease-out infinite; }
      .boot-ripple-2 { animation-delay: 1.2s; }
      .boot-ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid #fbd5e0; border-top-color: #d6336c; border-right-color: #f59e7a; animation: boot-spin 1.1s linear infinite; }
      .boot-badge { position: absolute; inset: 12%; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #fff; box-shadow: 0 14px 30px rgb(214 51 108 / 0.22); animation: boot-breathe 2.4s ease-in-out infinite; }
      .boot-badge img { display: block; width: 80%; height: 80%; }
      .boot-spark { position: absolute; width: 14px; height: 14px; background: #f6b73c; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0; animation: boot-twinkle 2.4s ease-in-out infinite; }
      .boot-spark.s1 { top: 3%; right: 6%; }
      .boot-spark.s2 { bottom: 8%; left: 4%; width: 10px; height: 10px; animation-delay: 0.8s; }
      .boot-spark.s3 { top: 46%; left: -3%; width: 9px; height: 9px; animation-delay: 1.6s; }
      .boot-text { margin: 0; font-size: 1.05rem; font-weight: 600; color: #9d174d; }
      .boot-dots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
      .boot-dots i { width: 6px; height: 6px; border-radius: 50%; background: #d6336c; animation: boot-dot 1.2s ease-in-out infinite; }
      .boot-dots i:nth-child(2) { animation-delay: 0.15s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.3s; }
      .boot small { display: block; font-size: 12px; color: #a8a29e; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-ripple { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0; } }
      @keyframes boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes boot-twinkle { 0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
      @keyframes boot-dot { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-badge, .boot-dots i { animation: none !important; }
        .boot-ripple, .boot-spark { display: none; }
        .boot-ring { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status">
        <div class="boot-art" aria-hidden="true">
          <span class="boot-ripple"></span>
          <span class="boot-ripple boot-ripple-2"></span>
          <span class="boot-ring"></span>
          <span class="boot-badge"><img src="/boot-icon.png" alt="" width="128" height="128" /></span>
          <i class="boot-spark s1"></i><i class="boot-spark s2"></i><i class="boot-spark s3"></i>
        </div>
        <p class="boot-text">กำลังเตรียมข้อมูล<span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
        <small>%BUILD_INFO%</small>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
