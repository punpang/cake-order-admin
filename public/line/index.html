<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เชื่อมบัญชี LINE</title>
<script>
  // กลับมาจากการเข้าสู่ระบบ LINE (มี code ใน URL) → เก็บพารามิเตอร์ไว้ให้ LIFF อ่านต่อ
  var q = location.search
  location.replace(/[?&]code=/.test(q) ? '/' + q + '#/line' : '/#/line')
</script>
</head>
<body>
<p>กำลังเปิดหน้าเชื่อมบัญชี LINE… <a href="/#/line">กดที่นี่ถ้าไม่ไปต่ออัตโนมัติ</a></p>
</body>
</html>
