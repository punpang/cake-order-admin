name: Build Android APK

# รันเองเท่านั้น: GitHub → Actions → Build Android APK → Run workflow
# ใช้ค่า VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY จาก Repository variables (ไม่ใช่ secret: เป็นค่าสาธารณะของ Supabase)
# ผลลัพธ์: artifact ชื่อ cake-admin-debug-apk (ไฟล์ app-debug.apk) สำหรับติดตั้งภายในร้าน
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # runner ubuntu-latest มี Android SDK ติดตั้งอยู่แล้ว (ANDROID_HOME) จึงไม่ใช้ android-actions/setup-android
      # (action นั้นเรียก sdkmanager tools ซึ่งล้มเหลวบน runner นี้) · sdkmanager ไม่อยู่ใน PATH จึงหาเส้นทางเอง
      - name: ติดตั้งส่วนประกอบ Android SDK ที่โปรเจกต์ใช้
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          echo "ใช้ sdkmanager ที่: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - name: สร้างไฟล์เว็บสำหรับแอป (โหมด Android)
        env:
          VITE_USE_SUPABASE: '1'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL || 'https://punpang-files.qpbdbdpq.workers.dev' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAGDvBxBOicWsJhZe' }}
        run: npm run build:android
      - name: คัดลอกไฟล์เว็บเข้าโปรเจกต์ Android
        run: npx cap sync android
      # กุญแจเซ็นแอปประจำร้าน (สร้างครั้งเดียวด้วย Create Android keystore) → ติดตั้งเวอร์ชันใหม่ทับของเดิมได้ ไม่ต้องถอนแอป
      # Gradle เซ็น debug build ด้วย ~/.android/debug.keystore อัตโนมัติ · ไม่มี secret = ใช้กุญแจสุ่มแบบเดิม (แจ้งเตือน)
      - name: ใช้กุญแจเซ็นแอปประจำร้าน
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::ยังไม่มี ANDROID_DEBUG_KEYSTORE · แอปจะเซ็นด้วยกุญแจสุ่ม (ติดตั้งทับเวอร์ชันเดิมไม่ได้)"; exit 0; fi
          for dir in "$HOME/.android" ${ANDROID_USER_HOME:+"$ANDROID_USER_HOME"}; do
            mkdir -p "$dir" && printf '%s' "$KS" | base64 -d > "$dir/debug.keystore"
          done
      - name: สร้าง APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: ตรวจว่า APK เซ็นด้วยกุญแจประจำร้าน
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then exit 0; fi
          want="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E '^\s*SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          SIGNER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          got="$("$SIGNER" verify --print-certs "android/app/build/outputs/apk/debug/app-debug.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')"
          echo "ใบรับรองของ APK: $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::APK ไม่ได้เซ็นด้วยกุญแจประจำร้าน"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cake-admin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7 # ลบเองหลัง 7 วัน (กันพื้นที่เก็บไฟล์ของ Actions เกินโควตา)
