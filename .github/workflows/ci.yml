name: CI

# ตรวจทุกครั้งที่ push เข้า main และทุก Pull Request (รันเองได้จากแท็บ Actions ด้วย)
# ไม่ deploy อะไรทั้งสิ้น · deploy ใช้ workflow แยก (Deploy ...) ที่รันเองเท่านั้น
#   node     : เทสต์ฝั่ง Node (รวมไฟล์ schedlib ที่คัดลอกต้องตรงต้นฉบับ) + สร้างเว็บ
#   deno     : เทสต์ Edge Function / Worker + ตรวจชนิดข้อมูลของทุกฟังก์ชัน
#   database : migration ทั้งหมดรันบน Postgres จริง แล้วทดสอบนโยบายความปลอดภัย (supabase/tests)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: เทสต์ฝั่ง Node (รวมตรวจว่าไฟล์คัดลอก schedlib ตรงกับต้นฉบับ)
        run: npm test
      - name: สร้างเว็บ
        run: npm run build

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลร่วมของ Edge Function (_shared) และ Worker
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/ worker/test/
      # ยิงคำขอจริงเข้า handler ของ customer-auth กับฐานข้อมูลจำลอง (ใช้ import map แทน supabase-js เฉพาะตอนเทสต์ ไม่กระทบการ deploy)
      - name: เทสต์ customer-auth ทั้งฟังก์ชัน
        run: deno test -A --no-lock --node-modules-dir=none --import-map=supabase/tests/functions/customer-auth/importmap.json supabase/tests/functions/customer-auth/
      # เส้นทางหลักครบทาง: โค้ดแอปตัวจริงยิงเข้า Edge Function ตัวจริง (จำลองเฉพาะฐานข้อมูล ไม่ใช้คีย์ ไม่แตะระบบจริง)
      # จับบั๊กแบบที่แอปกับเซิร์ฟเวอร์ตกลงกันไม่ตรง เช่น เลข TEST-OR ในโหมดทดสอบ
      - name: เทสต์เส้นทางสร้างออร์เดอร์ครบทาง (แอป → order-create · โหมดจริงและโหมดทดสอบ)
        run: deno test -A --no-lock --node-modules-dir=none --unstable-sloppy-imports --import-map=supabase/tests/functions/order-create/importmap.json supabase/tests/functions/order-create/
      - name: เทสต์การส่งข้อความในโหมดทดสอบ (telegram-send · fb-send ส่งได้เฉพาะรายชื่อทดสอบ)
        run: deno test -A --no-lock --node-modules-dir=none --import-map=supabase/tests/functions/messaging/importmap.json supabase/tests/functions/messaging/
      - name: ตรวจชนิดข้อมูลของทุก Edge Function
        run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: ติดตั้ง psql (ถ้ายังไม่มี)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: เทสต์ migration และนโยบายความปลอดภัยบน Postgres จริง
        run: bash supabase/tests/run.sh
