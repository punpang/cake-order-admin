name: CI

# ตรวจทุกครั้งที่ push เข้า main และทุก Pull Request (รันเองได้จากแท็บ Actions ด้วย)
# ไม่ deploy อะไรทั้งสิ้น · deploy ใช้ workflow แยก (Deploy ...) ที่รันเองเท่านั้น
#   node     : เทสต์ฝั่ง Node (รวมไฟล์ schedlib ที่คัดลอกต้องตรงต้นฉบับ) + สร้างเว็บ + ตรวจขนาดไฟล์
#   deno     : เทสต์ Edge Function / Worker + ตรวจชนิดข้อมูลของทุกฟังก์ชัน
#   database : migration ทั้งหมดรันบน Postgres จริง แล้วทดสอบนโยบายความปลอดภัย (supabase/tests)
#   e2e      : เทสต์หน้าจอในเบราว์เซอร์ (Playwright) ยกเว้นเทียบภาพ
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: เทสต์ฝั่ง Node (รวมตรวจว่าไฟล์คัดลอก schedlib ตรงกับต้นฉบับ)
        run: npm test
      - name: สร้างเว็บ
        run: npm run build
      - name: ตรวจขนาดไฟล์ (งบต่อไฟล์และงบรวมหลัง gzip · scripts/bundle-budget.mjs)
        run: npm run test:bundle

  # หน้าจอจริงในเบราว์เซอร์ (Playwright · โหมดข้อมูลตัวอย่าง ไม่แตะระบบจริง): เส้นทางหลัก POS คูปอง สิทธิ์ ทุกหน้าเปิดได้ จอมือถือ a11y XSS
  # ไม่รวมการเทียบภาพ (visual) เพราะผูกกับฟอนต์/การเรนเดอร์ของเครื่องที่สร้างภาพอ้างอิง · รันเองได้ด้วย npm run test:e2e
  # ไม่รันซ้ำบน main หลัง merge (รันแล้วตอนเปิด PR กับโค้ดที่รวม main แล้ว) → ประหยัดนาที Actions ราว 7 นาทีต่อ PR
  # แบ่ง e2e เป็น 4 งานรันขนาน (เดิมรันต่อกันงานเดียวราว 12 นาที) · แต่ละกลุ่มครอบคลุมไฟล์ตามรายการ
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ฐานข้อมูลตั้งค่า/คูปอง/ลูกค้า
            cmd: node e2e/creditCoupons.ui.e2e.mjs && node e2e/settingsCrud.ui.e2e.mjs && node e2e/settingsPages.ui.e2e.mjs && node e2e/settingsRisk.ui.e2e.mjs && node e2e/pointsCoupon.ui.e2e.mjs && node e2e/flows.ui.e2e.mjs && node e2e/roles.e2e.mjs && node e2e/responsive.e2e.mjs
          - name: หน้าร้าน/POS/พิมพ์
            cmd: node e2e/customerLayout.e2e.mjs && node e2e/a11y.e2e.mjs && node e2e/xss.e2e.mjs && node e2e/pos-concurrency.e2e.mjs && node e2e/dailyFeatures.ui.e2e.mjs && node e2e/printing.ui.e2e.mjs && node e2e/customerLazy.supabase.e2e.mjs && node e2e/flows.supabase.e2e.mjs
          - name: สมาชิก/เส้นทาง/POS แนวนอน
            cmd: node e2e/memberTier.supabase.e2e.mjs && node e2e/memberBirthdayCard.supabase.e2e.mjs && node e2e/routes.smoke.e2e.mjs && node e2e/pos-open-price.e2e.mjs && node e2e/consignRounds.ui.e2e.mjs && node e2e/pos-landscape.e2e.mjs && node e2e/cashService.ui.e2e.mjs
          - name: ออเดอร์/บัญชี/หน้าร้านใหม่
            cmd: node e2e/memberTiers.supabase.e2e.mjs && node e2e/dialogLandscape.ui.e2e.mjs && node e2e/orderCreateLayout.supabase.e2e.mjs && node e2e/orderListLayout.supabase.e2e.mjs && node e2e/paymentsLayout.supabase.e2e.mjs && node e2e/accountPolish.ui.e2e.mjs && node e2e/posLayout.ui.e2e.mjs && node e2e/posProductImage.ui.e2e.mjs && node e2e/storeHome.ui.e2e.mjs && node e2e/retailCategoryPicker.ui.e2e.mjs && node e2e/orderItemPicker.ui.e2e.mjs && node e2e/rewardPoints.ui.e2e.mjs && node e2e/posReceiptFeedback.ui.e2e.mjs && node e2e/thaiDateField.ui.e2e.mjs
    name: e2e · ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: แคช Chromium ของ Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: เตรียมโฟลเดอร์แคช apt ให้เขียนได้
        run: sudo chown -R "$USER" /var/cache/apt/archives
      - name: แคชแพ็กเกจ apt (ลดเวลาโหลดซ้ำ mirror ช้า)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ runner.os }}-${{ github.run_id }}
          restore-keys: apt-archives-${{ runner.os }}-
      - name: ติดตั้ง Chromium ของ Playwright และฟอนต์ไทย (ให้ความกว้างข้อความใกล้เครื่องพัฒนา)
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-thai-tlwg
      - name: เทสต์หน้าจอ (e2e ยกเว้นเทียบภาพ)
        run: ${{ matrix.cmd }}

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลร่วมของ Edge Function (_shared) และ Worker
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/ worker/test/
      # ยิงคำขอจริงเข้า handler ของ customer-auth กับฐานข้อมูลจำลอง (ใช้ import map แทน supabase-js เฉพาะตอนเทสต์ ไม่กระทบการ deploy)
      - name: เทสต์ customer-auth ทั้งฟังก์ชัน
        run: deno test -A --no-lock --node-modules-dir=none --import-map=supabase/tests/functions/customer-auth/importmap.json supabase/tests/functions/customer-auth/
      # เส้นทางหลักครบทาง: โค้ดแอป/Edge Function ตัวจริง ยิงเข้ากันจริง (จำลองเฉพาะฐานข้อมูลและบริการภายนอก ไม่ใช้คีย์ ไม่แตะระบบจริง)
      # สร้างออร์เดอร์ · ใบเสนอ→ออร์เดอร์ · ส่งข้อความโหมดทดสอบ · SMS · ลิงก์ออร์เดอร์ลูกค้า · รับแจ้งเตือนถุงเงิน (ทั้งโหมดจริงและโหมดทดสอบ)
      # เทสต์ทุกโฟลเดอร์ของ Edge Function ที่มีเทสต์ (ตรงกับ npm run test:fn) ยิงเข้าโค้ดตัวจริงกับฐานข้อมูลจำลอง
      - name: เทสต์ Edge Function ทุกโฟลเดอร์ (แอป → Edge Function)
        run: deno test -A --no-lock --node-modules-dir=none --unstable-sloppy-imports --import-map=supabase/tests/functions/_fake/importmap.json supabase/tests/functions/order-create/ supabase/tests/functions/flows/ supabase/tests/functions/messaging/ supabase/tests/functions/guard/ supabase/tests/functions/sms-send/ supabase/tests/functions/order-link/ supabase/tests/functions/tungngern-receiver/ supabase/tests/functions/loyalty/ supabase/tests/functions/lucky/ supabase/tests/functions/tungngern-list/ supabase/tests/functions/chat-photo-prune/ supabase/tests/functions/line-link/ supabase/tests/functions/campaign/ supabase/tests/functions/scheduled/ supabase/tests/functions/order-audit/ supabase/tests/functions/tax-invoice/ supabase/tests/functions/line-webhook/ supabase/tests/functions/push-send/ supabase/tests/functions/bot-test/ supabase/tests/functions/customer-order/ supabase/tests/functions/fb-connect/ supabase/tests/functions/fb-webhook/
      - name: ตรวจชนิดข้อมูลของทุก Edge Function
        run: deno check --no-lock --node-modules-dir=none supabase/functions/*/index.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: ติดตั้ง psql (ถ้ายังไม่มี)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: เทสต์ migration และนโยบายความปลอดภัยบน Postgres จริง
        run: bash supabase/tests/run.sh
