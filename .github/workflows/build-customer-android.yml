name: Build Customer Android APK

# รันเองเท่านั้น: GitHub → Actions → Build Customer Android APK → Run workflow
# แอปลูกค้า (แพ็กเกจ com.punpang.customer) แยกจากแอปพนักงาน (com.punpang.cakeadmin) ติดตั้งคู่กันได้
# ผลลัพธ์: artifact ชื่อ cake-customer-debug-apk (ไฟล์ app-debug.apk)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ติดตั้งส่วนประกอบ Android SDK เหมือนแอปพนักงาน (ดู build-android.yml)
      - name: ติดตั้งส่วนประกอบ Android SDK ที่โปรเจกต์ใช้
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          echo "ใช้ sdkmanager ที่: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      # ไฟล์ของ Capacitor (ปลั๊กอิน/การตั้งค่า Android) ไม่อยู่ใน git · cap sync ต้องมีเว็บ dist จึง build โหมด Android ก่อน (เหมือนแอปพนักงาน)
      - name: สร้างไฟล์ของ Capacitor สำหรับโปรเจกต์ Android
        env:
          VITE_USE_SUPABASE: '1'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL || 'https://punpang-files.qpbdbdpq.workers.dev' }}
        run: npm run build:android && npx cap sync android
      - name: สร้างไฟล์เว็บสำหรับแอปลูกค้า (โหมด customer)
        env:
          VITE_USE_SUPABASE: '1'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL || 'https://punpang-files.qpbdbdpq.workers.dev' }}
        run: npm run build:customer
      - name: สร้างโปรเจกต์ Android ของแอปลูกค้า
        run: node scripts/make-customer-android.mjs
      # กุญแจเซ็นแอปประจำร้าน (สร้างครั้งเดียวด้วย Create Android keystore) → ติดตั้งเวอร์ชันใหม่ทับของเดิมได้ ไม่ต้องถอนแอป
      # Gradle เซ็น debug build ด้วย ~/.android/debug.keystore อัตโนมัติ · ไม่มี secret = ใช้กุญแจสุ่มแบบเดิม (แจ้งเตือน)
      - name: ใช้กุญแจเซ็นแอปประจำร้าน
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::ยังไม่มี ANDROID_DEBUG_KEYSTORE · แอปจะเซ็นด้วยกุญแจสุ่ม (ติดตั้งทับเวอร์ชันเดิมไม่ได้)"; exit 0; fi
          for dir in "$HOME/.android" ${ANDROID_USER_HOME:+"$ANDROID_USER_HOME"}; do
            mkdir -p "$dir" && printf '%s' "$KS" | base64 -d > "$dir/debug.keystore"
          done
      - name: สร้าง APK (debug)
        working-directory: android-customer
        run: ./gradlew assembleDebug --no-daemon
      # เซ็นซ้ำด้วยกุญแจประจำร้านโดยตรง (ไม่พึ่งการเลือกกุญแจอัตโนมัติของ Gradle) แล้วค่อยตรวจด้านล่าง
      - name: เซ็น APK ด้วยกุญแจประจำร้าน
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then exit 0; fi
          SIGNER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$SIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android "android-customer/app/build/outputs/apk/debug/app-debug.apk"
      - name: ตรวจว่า APK เซ็นด้วยกุญแจประจำร้าน
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then exit 0; fi
          want="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E '^\s*SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          SIGNER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          got="$("$SIGNER" verify --print-certs "android-customer/app/build/outputs/apk/debug/app-debug.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')"
          echo "ใบรับรองของ APK: $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::APK ไม่ได้เซ็นด้วยกุญแจประจำร้าน"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: cake-customer-debug-apk
          path: android-customer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7 # ลบเองหลัง 7 วัน (กันพื้นที่เก็บไฟล์ของ Actions เกินโควตา)
