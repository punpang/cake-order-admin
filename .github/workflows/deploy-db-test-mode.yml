name: Deploy DB test mode

# รันเองเท่านั้น: GitHub → Actions → Deploy DB test mode → Run workflow
#   เลือก branch claude/loving-sagan-ygzxt1 (ไฟล์ migration อยู่บนสาขานี้จนกว่าจะ merge) · พิมพ์ RUN ให้ตรง
# ต้องมี secret SUPABASE_DB_URL (connection string แบบ session pooler ของ production พร้อมรหัสผ่าน) · ใช้ secret ตัวเดียวกับ deploy-db-lucky
# ต้องรัน deploy-db-lucky ให้เสร็จก่อน (สำเนาคัดลอกฟังก์ชันจากสถานะที่มี punpang_lucky_spin รุ่นหลายโครงการ)
# SQL ตามลำดับ (ธุรกรรมเดียว -1 ผิดพลาดขั้นใดย้อนกลับทั้งหมด):
#   1) supabase/migrations/20261116120000_punpang_test_schema.sql — schema punpang_test (สำเนาตาราง ฟังก์ชัน นโยบาย) และ punpang_test_sync
#   2) supabase/migrations/20261116130000_punpang_test_reset.sql — ปุ่มล้างข้อมูลทดสอบ และซิงก์สำเนา
#   3) supabase/migrations/20261116140000_punpang_test_seed.sql — ชุดตัวอย่าง ~90 วัน (ใส่เมื่อกดล้างข้อมูล) และฟังก์ชันเลื่อนวัน
# ไม่แตะข้อมูลจริง: ทุกคำสั่งสร้างหรือเขียนเฉพาะ schema punpang_test และฟังก์ชันใหม่ (ตรวจด้วยขั้นตอนตรวจหลังรัน)
# หลังรันแล้วต้องเพิ่ม punpang_test ใน Exposed schemas ของ Supabase API ก่อนใช้โหมดทดสอบ (ทำในแดชบอร์ด)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ RUN เพื่อยืนยัน'
        required: true
        type: string

concurrency:
  group: deploy-db-test-mode
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CONFIRM: ${{ github.event.inputs.confirm }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: ตรวจการยืนยันและ secret
        run: |
          if [ "$CONFIRM" != "RUN" ]; then echo "ยังไม่ได้พิมพ์ RUN เพื่อยืนยัน จึงไม่รัน"; exit 1; fi
          if [ -z "$SUPABASE_DB_URL" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_DB_URL"; exit 1; fi

      - uses: actions/checkout@v4

      - name: ติดตั้ง psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: ตรวจสภาพฐานข้อมูลก่อนรัน
        run: |
          t=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'punpang_records'")
          [ "$t" = "1" ] || { echo "ไม่พบตาราง punpang_records บน production"; exit 1; }
          l=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'punpang_lucky_spin' and p.pronargs = 3")
          [ "$l" = "1" ] || { echo "ยังไม่พบ punpang_lucky_spin รุ่นหลายโครงการ · ต้องรัน deploy-db-lucky ให้เสร็จก่อน"; exit 1; }

      - name: รัน SQL (ธุรกรรมเดียว)
        run: psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261116120000_punpang_test_schema.sql -f supabase/migrations/20261116130000_punpang_test_reset.sql -f supabase/migrations/20261116140000_punpang_test_seed.sql

      - name: ตรวจผลหลังรัน
        run: |
          s=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from information_schema.tables where table_schema = 'punpang_test' and table_type = 'BASE TABLE'")
          v=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from information_schema.views where table_schema = 'punpang_test'")
          [ "$s" = "23" ] && [ "$v" = "14" ] || { echo "สำเนาไม่ครบ: ตาราง $s (ต้อง 23) มุมมอง $v (ต้อง 14)"; exit 1; }
          f=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'punpang_test' and p.proname in ('punpang_test_sync', 'punpang_test_seed', 'punpang_test_shift')")
          [ "$f" = "3" ] || { echo "ยังไม่พบฟังก์ชันของโหมดทดสอบครบ"; exit 1; }
          r=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'punpang_reset_test_data'")
          [ "$r" = "1" ] || { echo "ยังไม่พบปุ่มล้างข้อมูลทดสอบ"; exit 1; }
          echo "ผ่าน: สำเนา punpang_test (23 ตาราง 14 มุมมอง) พร้อมชุดตัวอย่างและปุ่มล้างข้อมูลทดสอบแล้ว"
