name: Deploy fb-connect

# รันเองเท่านั้น: GitHub → Actions → Deploy fb-connect → Run workflow
# ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy · ถ้าเทสต์ล้มเหลว ฟังก์ชันบน production ไม่ถูกเปลี่ยน
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/
      - name: ตรวจชนิดข้อมูลของ fb-connect
        run: deno check --no-lock --node-modules-dir=none supabase/functions/fb-connect/index.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: รันจาก main เท่านั้น
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "รันได้เฉพาะจาก main"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: ตั้งค่าเดิมบน production (ฟังก์ชันตรวจสิทธิ์พนักงานเองภายใน)
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy fb-connect
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy fb-connect --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
