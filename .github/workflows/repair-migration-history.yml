name: Repair migration history

# รันเองเท่านั้น: GitHub → Actions → Repair migration history → Run workflow
#   พิมพ์ RUN ให้ตรง · ใช้ branch claude/zen-gauss-5qbmyh
# ทำอะไร: ลบ 6 แถวที่เพิ่มเข้า supabase_migrations.schema_migrations ผิดพลาดก่อนหน้า
#   (version ซ้ำกับชื่อ migration ที่บันทึกโดยบัญชีเจ้าของแล้ว) ด้วย supabase migration repair --status reverted
# ไม่แตะตาราง public และไม่รัน SQL ของ migration ใด ๆ
# ความปลอดภัย: ก่อนลบจะตรวจว่าทุกแถวเป็นแถวที่ created_by ว่าง (แถวที่ผมเพิ่ม) ถ้าไม่ตรงจะหยุดทันที
# ต้องมี secret SUPABASE_ACCESS_TOKEN (ใช้กับ workflow deploy อยู่แล้ว) และ SUPABASE_DB_URL (session pooler ของ production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ RUN เพื่อยืนยัน'
        required: true
        type: string

concurrency:
  group: repair-migration-history
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CONFIRM: ${{ github.event.inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: ตรวจการยืนยันและ secret
        run: |
          if [ "$CONFIRM" != "RUN" ]; then echo "ยังไม่ได้พิมพ์ RUN เพื่อยืนยัน จึงไม่รัน"; exit 1; fi
          if [ -z "$SUPABASE_DB_URL" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_DB_URL"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_ACCESS_TOKEN"; exit 1; fi

      - name: ติดตั้ง psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: ตรวจว่าทั้ง 6 แถวเป็นแถวที่ผมเพิ่มเอง (created_by ว่าง) ก่อนลบ
        run: |
          n=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from supabase_migrations.schema_migrations where version in ('20261113120000','20261113130000','20261113150000','20261114000000','20261114010000','20261114020000') and created_by is null")
          if [ "$n" != "6" ]; then echo "พบ $n แถวที่ตรงเงื่อนไข (ต้องเป็น 6) จึงหยุดไม่ลบ"; exit 1; fi
          echo "ผ่าน: 6 แถวตรงเงื่อนไข"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: ลบแถวประวัติ 6 รายการ (reverted เฉพาะประวัติ ไม่รัน SQL)
        run: |
          supabase migration repair --status reverted --db-url "$SUPABASE_DB_URL" --yes \
            20261113120000 20261113130000 20261113150000 20261114000000 20261114010000 20261114020000

      - name: ตรวจผลหลังลบ
        run: |
          n=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from supabase_migrations.schema_migrations where version in ('20261113120000','20261113130000','20261113150000','20261114000000','20261114010000','20261114020000')")
          t=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from supabase_migrations.schema_migrations")
          [ "$n" = "0" ] || { echo "ยังเหลือ $n แถวที่ควรลบ"; exit 1; }
          echo "ผ่าน: ไม่เหลือแถวที่ควรลบ · ประวัติทั้งหมดตอนนี้ $t แถว (คาดหวัง 93)"
