name: Deploy DB 2026-11-20 (สถานะย้อน + ใบเสนอ)

# รันเองเท่านั้น: GitHub → Actions → Deploy DB 2026-11-20 → Run workflow · เลือก branch main เท่านั้น
#   batch AB (รันก่อน deploy order-create): 20261120130000 (สิทธิ์ย้อนสถานะ) + 20261120140000 (สร้างออร์เดอร์จากใบเสนอแบบอะตอมิก) ในธุรกรรมเดียว
#   batch C (รันหลัง deploy order-create ใหม่และหลังตรวจไม่มีใบเสนอซ้ำ): 20261120150000 (ดัชนีกันใบเสนอซ้ำ)
# ต้องมี secret SUPABASE_DB_URL ใน environment production · พิมพ์ RUN ให้ตรง

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ RUN เพื่อยืนยัน'
        required: true
        type: string
      batch:
        description: 'ชุดที่รัน (AB หรือ C)'
        required: true
        type: choice
        options:
          - AB
          - C

concurrency:
  group: deploy-db-2026-11-20
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    env:
      CONFIRM: ${{ github.event.inputs.confirm }}
      BATCH: ${{ github.event.inputs.batch }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: รันจาก main เท่านั้น
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "รันได้เฉพาะจาก main"; exit 1; }'

      - name: ตรวจการยืนยันและ secret
        run: |
          if [ "$CONFIRM" != "RUN" ]; then echo "ยังไม่ได้พิมพ์ RUN เพื่อยืนยัน จึงไม่รัน"; exit 1; fi
          if [ -z "$SUPABASE_DB_URL" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_DB_URL ใน environment production"; exit 1; fi

      - uses: actions/checkout@v4

      - name: ติดตั้ง psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: ตรวจสภาพฐานข้อมูลก่อนรัน
        run: |
          s=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from information_schema.schemata where schema_name = 'punpang_test'")
          [ "$s" = "1" ] || { echo "ไม่พบสคีมา punpang_test บน production (migration นี้ต้องการ)"; exit 1; }
          if [ "$BATCH" = "AB" ]; then
            t=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'punpang_quotes'")
            [ "$t" = "1" ] || { echo "ไม่พบตาราง punpang_quotes"; exit 1; }
          else
            f=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'punpang_quote_order_create'")
            [ "$f" = "1" ] || { echo "ยังไม่พบ punpang_quote_order_create · ต้องรันชุด AB ก่อน"; exit 1; }
            d=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from (select data->>'quoteId' as q from public.punpang_orders where coalesce(data->>'quoteId', '') <> '' group by 1 having count(*) > 1) x")
            [ "$d" = "0" ] || { echo "พบใบเสนอที่มีออร์เดอร์มากกว่าหนึ่งใบ $d รายการ · ต้องแก้ข้อมูลก่อนจึงจะสร้างดัชนีได้"; exit 1; }
          fi

      - name: รัน SQL (ธุรกรรมเดียว)
        run: |
          if [ "$BATCH" = "AB" ]; then
            psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261120130000_punpang_status_reversal.sql -f supabase/migrations/20261120140000_punpang_quote_order_rpc.sql
          else
            psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261120150000_punpang_quote_order_unique.sql
          fi

      - name: ตรวจผลหลังรัน
        run: |
          if [ "$BATCH" = "AB" ]; then
            f=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname in ('punpang_quote_order_create', 'punpang_guard_status', 'punpang_set_status')")
            [ "$f" = "3" ] || { echo "ฟังก์ชันไม่ครบหลังรัน (พบ $f จาก 3)"; exit 1; }
          else
            i=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_indexes where schemaname = 'public' and indexname = 'punpang_orders_quote_uniq'")
            [ "$i" = "1" ] || { echo "ไม่พบดัชนี punpang_orders_quote_uniq หลังรัน"; exit 1; }
          fi
          echo "ผ่าน: ชุด $BATCH รันเสร็จ"
