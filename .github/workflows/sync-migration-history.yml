name: Sync migration history

# รันเองเท่านั้น: GitHub → Actions → Sync migration history → Run workflow → เลือก branch main
#   พิมพ์ RUN ให้ตรง · รันได้จาก main เท่านั้น
# ทำอะไร: ปรับประวัติ supabase_migrations.schema_migrations ของ production ให้ตรงกับไฟล์ใน supabase/migrations/
#   - reverted: เพิกถอน 7 แถวที่ไม่มีไฟล์ตรงเวอร์ชัน
#   - applied: บันทึก 17 เวอร์ชันที่มีไฟล์แต่ยังไม่อยู่ในประวัติ
# ไม่รัน SQL ของ migration ใด ๆ และไม่แก้ตารางหรือฟังก์ชันใน schema public
# ความปลอดภัย: ตรวจทุกขั้นก่อนแก้ ถ้ารายการไม่ตรงกับที่กำหนดไว้จะหยุดทันทีโดยไม่เปลี่ยนอะไร
# ต้องมี secret SUPABASE_ACCESS_TOKEN และ SUPABASE_DB_URL (session pooler ของ production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ RUN เพื่อยืนยัน'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-migration-history
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIRM: ${{ github.event.inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      REVERT_VERSIONS: 20261114024149 20261117102050 20261118015315 20261118083225 20261118083232 20261118083241 20261119115028
      APPLY_VERSIONS: 20261117130000 20261117140000 20261117150000 20261117160000 20261117170000 20261117180000 20261117190000 20261117200000 20261118120000 20261119120000 20261119130000 20261119140000 20261119150000 20261119160000 20261120100000 20261120110000 20261120120000
    steps:
      - name: ตรวจการยืนยัน branch และ secret
        run: |
          if [ "$CONFIRM" != "RUN" ]; then echo "ยังไม่ได้พิมพ์ RUN เพื่อยืนยัน จึงไม่รัน"; exit 1; fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "รันได้จาก main เท่านั้น"; exit 1; fi
          if [ -z "$SUPABASE_DB_URL" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_DB_URL"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_ACCESS_TOKEN"; exit 1; fi

      - uses: actions/checkout@v4

      - name: ติดตั้ง psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # ปักเวอร์ชันไว้ที่ 3.2.0 เพราะคำสั่งด้านล่างทดสอบกับเวอร์ชันนี้แล้ว
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: ตรวจก่อนแก้ (ไม่ตรงข้อใดจะหยุดโดยไม่เปลี่ยนอะไร)
        run: |
          set -euo pipefail
          export LC_ALL=C
          xargs -n1 <<< "$REVERT_VERSIONS" | sort > expected_revert.txt
          xargs -n1 <<< "$APPLY_VERSIONS" | sort > expected_apply.txt
          bad=$(ls supabase/migrations | grep -vE '^[0-9]{14}_.+\.sql$' || true)
          if [ -n "$bad" ]; then echo "มีไฟล์ใน supabase/migrations ที่ชื่อไม่ตรงรูปแบบ:"; echo "$bad"; exit 1; fi
          ls supabase/migrations | sed -E 's/_.*$//' | sort > repo.txt
          dup=$(uniq -d repo.txt)
          if [ -n "$dup" ]; then echo "มีเวอร์ชันซ้ำในไฟล์ migration:"; echo "$dup"; exit 1; fi
          psql "$SUPABASE_DB_URL" -X -tA -c "select version from supabase_migrations.schema_migrations order by version" | sort > db.txt
          n=$(wc -l < db.txt)
          echo "แถวในประวัติตอนนี้: $n (คาดหวัง 105)"
          [ "$n" = "105" ] || { echo "จำนวนแถวไม่ใช่ 105 จึงหยุด"; exit 1; }
          comm -23 db.txt repo.txt > only_db.txt
          comm -13 db.txt repo.txt > only_repo.txt
          cmp -s only_db.txt expected_revert.txt || { echo "แถวที่ไม่มีไฟล์ตรงไม่ตรงที่กำหนดไว้ จึงหยุด"; diff only_db.txt expected_revert.txt || true; exit 1; }
          cmp -s only_repo.txt expected_apply.txt || { echo "เวอร์ชันที่ยังไม่อยู่ในประวัติไม่ตรงที่กำหนดไว้ จึงหยุด"; diff only_repo.txt expected_apply.txt || true; exit 1; }
          echo "ผ่าน: เพิกถอน 7 แถวและบันทึก 17 เวอร์ชันตรงที่กำหนดทุกข้อ"

      - name: ซ่อมประวัติ (reverted/applied เท่านั้น ไม่รัน SQL ของ migration)
        run: |
          set -euo pipefail
          read -ra REVERT <<< "$REVERT_VERSIONS"
          read -ra APPLY <<< "$APPLY_VERSIONS"
          supabase migration repair --status reverted --remote="$SUPABASE_DB_URL" --yes "${REVERT[@]}"
          supabase migration repair --status applied --remote="$SUPABASE_DB_URL" --yes "${APPLY[@]}"

      - name: ตรวจผลหลังซ่อม (ประวัติต้องตรงกับไฟล์ทุกเวอร์ชัน)
        run: |
          set -euo pipefail
          export LC_ALL=C
          ls supabase/migrations | sed -E 's/_.*$//' | sort > repo.txt
          psql "$SUPABASE_DB_URL" -X -tA -c "select version from supabase_migrations.schema_migrations order by version" | sort > db.txt
          n=$(wc -l < db.txt)
          echo "แถวในประวัติตอนนี้: $n (คาดหวัง 115)"
          [ "$n" = "115" ] || { echo "จำนวนแถวไม่ใช่ 115 จึงถือว่าไม่สำเร็จ"; exit 1; }
          cmp -s db.txt repo.txt || { echo "ประวัติยังไม่ตรงกับไฟล์ใน supabase/migrations"; diff db.txt repo.txt || true; exit 1; }
          echo "ผ่าน: ประวัติ 115 แถว ตรงกับไฟล์ใน supabase/migrations ทุกเวอร์ชัน"
