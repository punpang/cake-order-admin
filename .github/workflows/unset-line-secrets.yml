name: Unset LINE secrets

# รันเองครั้งเดียว: GitHub → Actions → Unset LINE secrets → Run workflow → พิมพ์ UNSET ให้ตรง
# ลบ secrets ของ LINE OA (LINE_CHANNEL_ACCESS_TOKEN, LINE_CHANNEL_SECRET) ออกจาก production · แสดงเฉพาะชื่อ ไม่แสดงค่า
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ UNSET เพื่อยืนยัน'
        required: true
        type: string

jobs:
  unset:
    if: github.event.inputs.confirm == 'UNSET'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: รายชื่อ secrets ก่อนลบ (แสดงเฉพาะชื่อ)
        run: supabase secrets list --remote=itleduijrckxdbhhuooi
      - name: ลบ LINE_CHANNEL_ACCESS_TOKEN และ LINE_CHANNEL_SECRET
        run: supabase secrets unset LINE_CHANNEL_ACCESS_TOKEN LINE_CHANNEL_SECRET --remote=itleduijrckxdbhhuooi --yes
      - name: รายชื่อ secrets หลังลบ (ต้องไม่มี LINE)
        run: supabase secrets list --remote=itleduijrckxdbhhuooi
