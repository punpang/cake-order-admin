name: Deploy DB 2026-11-15

# รันเองเท่านั้น: GitHub → Actions → Deploy DB 2026-11-15 → Run workflow
#   เลือก branch claude/loving-sagan-ygzxt1 · เลือกขั้น · พิมพ์ RUN ให้ตรง
# ต้องมี secret SUPABASE_DB_URL (connection string แบบ session pooler ของ production พร้อมรหัสผ่าน)
#   ตั้งที่ GitHub → Settings → Secrets and variables → Actions → New repository secret
# ขั้น run-once = supabase/deploy/2026-11-15-run-once.sql (ธุรกรรมเดียว: ผิดพลาดขั้นใดย้อนกลับทั้งหมด)
# ขั้น 080000 = supabase/migrations/20261115080000_punpang_quote_server.sql · รันหลังหน้าเว็บใหม่ขึ้นแล้วเท่านั้น

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'ขั้นที่จะรัน (run-once ก่อน, 080000 หลังหน้าเว็บใหม่)'
        required: true
        type: choice
        options:
          - run-once
          - "080000"
      confirm:
        description: 'พิมพ์ RUN เพื่อยืนยัน'
        required: true
        type: string

concurrency:
  group: deploy-db-2026-11-15
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      STEP: ${{ github.event.inputs.step }}
      CONFIRM: ${{ github.event.inputs.confirm }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: ตรวจการยืนยันและ secret
        run: |
          if [ "$CONFIRM" != "RUN" ]; then echo "ยังไม่ได้พิมพ์ RUN เพื่อยืนยัน จึงไม่รัน"; exit 1; fi
          if [ -z "$SUPABASE_DB_URL" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_DB_URL"; exit 1; fi

      - uses: actions/checkout@v4

      - name: ติดตั้ง psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: ตรวจสภาพฐานข้อมูลก่อนรัน
        run: |
          vault=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from vault.decrypted_secrets where name = 'push_send_key'")
          [ "$vault" = "1" ] || { echo "ไม่พบ Vault push_send_key บน production"; exit 1; }
          if [ "$STEP" = "080000" ]; then
            gate=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_proc where proname = 'punpang_order_gate'")
            [ "$gate" = "1" ] || { echo "ยังไม่พบ punpang_order_gate: ต้องรัน run-once ก่อน"; exit 1; }
          fi

      - name: รัน SQL
        run: |
          if [ "$STEP" = "run-once" ]; then
            psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/deploy/2026-11-15-run-once.sql
          else
            psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261115080000_punpang_quote_server.sql
          fi
