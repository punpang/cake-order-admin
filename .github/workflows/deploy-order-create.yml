name: Deploy order-create

# รันเองเท่านั้น: GitHub → Actions → Deploy order-create → Run workflow
# ลำดับ deploy (ห้ามสลับ): 1) workflow นี้ · 2) หน้าเว็บ/แอป · 3) migration 20261117140000 (ปิดการเขียนออร์เดอร์ที่ไม่ใช่ POS ตรง)
# ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy · ถ้าเทสต์ล้มเหลว ฟังก์ชันบน production ไม่ถูกเปลี่ยน
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared รวม schedlib/orderCreate)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/
      - name: ตรวจชนิดข้อมูลของ order-create
        run: deno check --no-lock --node-modules-dir=none supabase/functions/order-create/index.ts
      # แอปตัวจริง (ตัวออกเลข + pushOrders) ยิงเข้า order-create ตัวจริง ทั้งโหมดจริงและโหมดทดสอบ (จำลองเฉพาะฐานข้อมูล)
      - name: เทสต์เส้นทางสร้างออร์เดอร์ครบทาง (แอป → order-create)
        run: deno test -A --no-lock --node-modules-dir=none --unstable-sloppy-imports --import-map=supabase/tests/functions/_fake/importmap.json supabase/tests/functions/order-create/ supabase/tests/functions/flows/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: รันจาก main เท่านั้น
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "รันได้เฉพาะจาก main"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # ตรวจ JWT ปกติ (แอปพนักงานส่ง token) · ฟังก์ชันตรวจสิทธิ์พนักงานซ้ำอีกชั้น
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy order-create
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy order-create --project-ref itleduijrckxdbhhuooi --yes
