name: Deploy line-link

# รันเองเท่านั้น: GitHub → Actions → Deploy line-link → Run workflow
# ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy · ถ้าเทสต์ล้มเหลว ฟังก์ชันบน production ไม่ถูกเปลี่ยน
# ไม่ต้องใช้ secret ใหม่ (ใช้ SUPABASE_URL และ SUPABASE_SERVICE_ROLE_KEY ที่ Supabase มีอยู่แล้ว)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: เว็บลูกค้าเรียกด้วยเซสชันลูกค้าเอง (ไม่ใช้ JWT ของ Supabase)
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy line-link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy line-link --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
