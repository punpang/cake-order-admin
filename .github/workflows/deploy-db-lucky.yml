name: Deploy DB lucky draw

# รันเองเท่านั้น: GitHub → Actions → Deploy DB lucky draw → Run workflow
#   เลือก branch claude/loving-sagan-ygzxt1 (ไฟล์ migration อยู่บนสาขานี้จนกว่าจะ merge) · พิมพ์ RUN ให้ตรง
# ต้องมี secret SUPABASE_DB_URL (connection string แบบ session pooler ของ production พร้อมรหัสผ่าน)
# SQL = supabase/migrations/20261115160000_punpang_lucky_draw.sql · ธุรกรรมเดียว (-1): ผิดพลาดขั้นใดย้อนกลับทั้งหมด
# เพิ่ม collection luckyTokens ใน punpang_records + อัปเดต punpang_rec_can · รันก่อน deploy แอปที่ใช้ลุ้นโชค

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ RUN เพื่อยืนยัน'
        required: true
        type: string

concurrency:
  group: deploy-db-lucky
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CONFIRM: ${{ github.event.inputs.confirm }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - name: ตรวจการยืนยันและ secret
        run: |
          if [ "$CONFIRM" != "RUN" ]; then echo "ยังไม่ได้พิมพ์ RUN เพื่อยืนยัน จึงไม่รัน"; exit 1; fi
          if [ -z "$SUPABASE_DB_URL" ]; then echo "ยังไม่ได้ตั้ง secret SUPABASE_DB_URL"; exit 1; fi

      - uses: actions/checkout@v4

      - name: ติดตั้ง psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: ตรวจสภาพฐานข้อมูลก่อนรัน
        run: |
          t=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'punpang_records'")
          [ "$t" = "1" ] || { echo "ไม่พบตาราง punpang_records บน production"; exit 1; }
          f=$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_proc where proname = 'punpang_rec_can'")
          [ "$f" = "1" ] || { echo "ไม่พบฟังก์ชัน punpang_rec_can บน production"; exit 1; }

      - name: รัน SQL (ธุรกรรมเดียว)
        run: psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/migrations/20261115160000_punpang_lucky_draw.sql

      - name: ตรวจผลหลังรัน
        run: |
          c=$(psql "$SUPABASE_DB_URL" -X -tA -c "select pg_get_constraintdef(oid) like '%luckyTokens%' from pg_constraint where conname = 'punpang_records_collection_check'")
          [ "$c" = "t" ] || { echo "ยังไม่พบ luckyTokens ใน constraint"; exit 1; }
          echo "ผ่าน: เพิ่ม luckyTokens และอัปเดตสิทธิ์แล้ว"
