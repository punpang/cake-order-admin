name: Deploy customer-auth

# รันเองเท่านั้น: GitHub → Actions → Deploy customer-auth → Run workflow
# ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy · ถ้าเทสต์ล้มเหลว ฟังก์ชันบน production ไม่ถูกเปลี่ยน
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/
      # ยิงคำขอจริงเข้า handler (เข้าสู่ระบบ / ตรวจ OTP / บันทึกโปรไฟล์ รวมกรณียิงพร้อมกัน) กับฐานข้อมูลจำลอง
      - name: เทสต์ customer-auth ทั้งฟังก์ชัน
        run: deno test -A --no-lock --node-modules-dir=none --import-map=supabase/tests/functions/customer-auth/importmap.json supabase/tests/functions/customer-auth/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: หน้าบัญชีของลูกค้าเรียกโดยไม่ได้ล็อกอินของ Supabase (ตั้งค่าเดิม)
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy customer-auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy customer-auth --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
