name: Create Android keystore

# รันครั้งเดียว: สร้างกุญแจเซ็นแอป Android ประจำร้าน แล้วเก็บเข้า GitHub Secrets (ANDROID_DEBUG_KEYSTORE) โดยตรง
# กุญแจไม่ออกจากเครื่อง runner (ไม่พิมพ์ลง log ไม่อัปโหลดเป็นไฟล์) · มีกุญแจอยู่แล้ว = ไม่สร้างทับ (กันแอปที่ติดตั้งไว้ติดตั้งทับไม่ได้)
# ต้องมี secret KEYSTORE_SETUP_TOKEN = fine-grained token ของ GitHub ที่มีสิทธิ์ Secrets: Read and write เฉพาะ repo นี้ (ลบได้หลังรันเสร็จ)
# กุญแจใช้รหัสผ่านมาตรฐานของ debug build (android) · ความลับอยู่ที่ตัวไฟล์ซึ่งเก็บใน Secrets เท่านั้น
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ CREATE เพื่อยืนยัน'
        required: true
        type: string

permissions:
  contents: read

jobs:
  create:
    if: inputs.confirm == 'CREATE'
    runs-on: ubuntu-latest
    steps:
      - name: สร้างกุญแจและเก็บเข้า Secrets
        env:
          GH_TOKEN: ${{ secrets.KEYSTORE_SETUP_TOKEN }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_KEYSTORE" = "true" ]; then echo "::error::มี ANDROID_DEBUG_KEYSTORE อยู่แล้ว ไม่สร้างทับ"; exit 1; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::ยังไม่ได้ตั้ง secret KEYSTORE_SETUP_TOKEN"; exit 1; fi
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          keytool -genkeypair -keystore "$d/debug.keystore" -storetype PKCS12 -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          base64 -w0 "$d/debug.keystore" | gh secret set ANDROID_DEBUG_KEYSTORE --repo "$GITHUB_REPOSITORY"
          # ลายนิ้วมือของใบรับรองเป็นข้อมูลสาธารณะ (ใช้จำกัด Firebase API key ด้วย SHA-1 ได้)
          echo "บันทึก ANDROID_DEBUG_KEYSTORE แล้ว · ลายนิ้วมือใบรับรอง:"
          keytool -list -v -keystore "$d/debug.keystore" -storepass android -alias androiddebugkey | grep -E '^\s*SHA(1|256):'
