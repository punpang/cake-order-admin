name: Deploy slip-train-prune

# รันเองเท่านั้น: GitHub → Actions → Deploy slip-train-prune → Run workflow
# ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy · ฟังก์ชันนี้ตรวจคีย์เองทุกครั้ง (--no-verify-jwt) และรับเฉพาะคีย์ service role
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: ฟังก์ชันตรวจ Bearer คีย์ service role เองอยู่แล้ว
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy slip-train-prune
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy slip-train-prune --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
