name: Deploy bot-test

# รันเองเท่านั้น: GitHub → Actions → Deploy bot-test → Run workflow
# ทดสอบบอทตอบแชทในโหมดทดสอบ (ไม่ส่งถึงลูกค้าจริง) · ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy
# ไม่ใส่ --no-verify-jwt: ฟังก์ชันนี้ตรวจ JWT ของแอดมินเองด้วย และต้องเปิดการตรวจที่ gateway เหมือนฟังก์ชันพนักงานอื่น
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/
      - name: ตรวจชนิดข้อมูลของ bot-test
        run: deno check --no-lock --node-modules-dir=none supabase/functions/bot-test/index.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: รันจาก main เท่านั้น
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "รันได้เฉพาะจาก main"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy bot-test
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy bot-test --project-ref itleduijrckxdbhhuooi --yes
