name: Deploy Edge 2026-11-15

# รันเองเท่านั้น: GitHub → Actions → Deploy Edge 2026-11-15 → Run workflow
#   เลือก branch main (รันได้เฉพาะ main) · เลือกฟังก์ชันทีละตัว
# ใช้ secret SUPABASE_ACCESS_TOKEN ที่มีอยู่แล้ว · ขั้นเทสต์และตรวจชนิดข้อมูลต้องผ่านก่อนจึงจะ deploy
# order-audit ใช้ --no-verify-jwt เพราะ pg_cron เรียกด้วย x-cron-key (ไม่มี JWT)
# push-send มี workflow แยกอยู่แล้ว (Deploy push-send)

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'ฟังก์ชันที่จะ deploy'
        required: true
        type: choice
        options:
          - order-audit
          - quote-create
          - sms-send

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FUNCTION: ${{ github.event.inputs.function }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/
      - name: ตรวจชนิดข้อมูลของฟังก์ชันที่เลือก
        run: deno check --no-lock --node-modules-dir=none "supabase/functions/$FUNCTION/index.ts"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      FUNCTION: ${{ github.event.inputs.function }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: รันจาก main เท่านั้น
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "รันได้เฉพาะจาก main"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ฟังก์ชันที่เลือก
        run: |
          if [ "$FUNCTION" = "order-audit" ]; then
            supabase functions deploy "$FUNCTION" --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
          else
            supabase functions deploy "$FUNCTION" --project-ref itleduijrckxdbhhuooi --yes
          fi
