name: Deploy scheduled

# รันเองเท่านั้น: GitHub → Actions → Deploy scheduled → Run workflow
# ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy · ถ้าเทสต์ล้มเหลว ฟังก์ชันบน production ไม่ถูกเปลี่ยน
# หมายเหตุ: ยังไม่มีผลบนระบบจริงจนกว่าจะรัน migration punpang_scheduled_cron และตั้ง config/scheduled.server = true
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: ตรวจว่าสำเนาโมดูลที่ใช้ร่วมกัน (schedlib) ตรงกับ src/lib
        run: node src/lib/schedlibSync.test.mjs
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: pg_cron เรียกโดยไม่มี JWT (ยืนยันด้วยคีย์ x-cron-key ที่ตั้งใน SCHEDULED_KEY)
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy scheduled
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy scheduled --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
