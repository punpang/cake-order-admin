name: Deploy line-webhook

# รันเองเท่านั้น: GitHub → Actions → Deploy line-webhook → Run workflow
# ขั้นเทสต์ต้องผ่านก่อน จึงจะ deploy · ถ้าเทสต์ล้มเหลว ฟังก์ชันบน production ไม่ถูกเปลี่ยน
# ต้องตั้ง secret ของ Supabase ก่อน: LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: เทสต์โมดูลที่ใช้ร่วมกัน (_shared)
        run: deno test --no-prompt --no-lock --node-modules-dir=none supabase/functions/_shared/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: รันจาก main เท่านั้น
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "รันได้เฉพาะจาก main"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: LINE เรียก webhook โดยไม่มี JWT (ความปลอดภัยใช้ลายเซ็น x-line-signature แทน)
      # --yes: ไม่มี TTY ใน Actions จึงต้องยืนยันล่วงหน้า
      - name: Deploy line-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy line-webhook --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
