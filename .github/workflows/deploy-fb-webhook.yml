name: Deploy fb-webhook

# รันเองเท่านั้น: GitHub → Actions → Deploy fb-webhook → Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --no-verify-jwt: Meta เรียก webhook โดยไม่มี JWT (ความปลอดภัยใช้ลายเซ็น X-Hub-Signature-256 แทน)
      - name: Deploy fb-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy fb-webhook --project-ref itleduijrckxdbhhuooi --no-verify-jwt --yes
